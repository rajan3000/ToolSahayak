<body>

<header>

  </p>

  </div>

    <button type="button" onclick="calculateAge()">Calculate Age</button>
    <button type="button" class="reset-btn" onclick="resetCalculator()">Reset</button>
  </div>

<script>
const dobInput = document.getElementById("dob");
const asOfInput = document.getElementById("asOfDate");

function getLocalDateString(date){
  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

function parseDate(value){
  if(!value) return null;

  const parts = value.split("-").map(Number);
  const year = parts[0];
  const month = parts[1];
  const day = parts[2];

  const date = new Date(year,month-1,day);
  date.setHours(0,0,0,0);

  if(
    date.getFullYear()!==year ||
    date.getMonth()!==month-1 ||
    date.getDate()!==day
  ){
    return null;
  }

  return date;
}

function dateString(date){
  const d = String(date.getDate()).padStart(2,"0");
  const m = String(date.getMonth()+1).padStart(2,"0");
  const y = date.getFullYear();

  return `${d}-${m}-${y}`;
}

function daysBetween(start,end){
  const utcStart = Date.UTC(
    start.getFullYear(),
    start.getMonth(),
    start.getDate()
  );

  const utcEnd = Date.UTC(
    end.getFullYear(),
    end.getMonth(),
    end.getDate()
  );

  return Math.round((utcEnd-utcStart)/86400000);
}

function calculateAge(){

  const error = document.getElementById("error");
  const result = document.getElementById("result");

  error.textContent="";
  result.style.display="none";

  if(!dobInput.value){
    error.textContent="Please select your Date of Birth.";
    return;
  }

  if(!asOfInput.value){
    error.textContent="Please select the Calculate Age As Of date.";
    return;
  }

  const dob = parseDate(dobInput.value);
  const asOf = parseDate(asOfInput.value);

  if(!dob || !asOf){
    error.textContent="Please select valid dates.";
    return;
  }

  if(asOf<dob){
    error.textContent="Calculate Age As Of date cannot be before Date of Birth.";
    return;
  }

  const birthYear = dob.getFullYear();
  const birthMonth = dob.getMonth();
  const birthDay = dob.getDate();

  let years = asOf.getFullYear()-birthYear;
  let months = asOf.getMonth()-birthMonth;
  let days = asOf.getDate()-birthDay;

  if(days<0){
    months--;

    const previousMonth = new Date(
      asOf.getFullYear(),
      asOf.getMonth(),
      0
    );

    days += previousMonth.getDate();
  }

  if(months<0){
    years--;
    months+=12;
  }

  const totalDays = daysBetween(dob,asOf);
  const totalWeeks = Math.floor(totalDays/7);
  const remainingDays = totalDays%7;

  const birthDayName = dob.toLocaleDateString("en-IN",{
    weekday:"long"
  });

  const asOfDayName = asOf.toLocaleDateString("en-IN",{
    weekday:"long"
  });

  document.getElementById("ageText").textContent =
    `${years} Years, ${months} Months, ${days} Days`;

  const details = document.getElementById("details");

  details.innerHTML="";

  const rows = [
    ["Date of Birth",dateString(dob)],
    ["Birth Day",birthDayName],
    ["Calculate Age As Of",dateString(asOf)],
    ["Selected Date Day",asOfDayName],
    ["Total Years",years.toLocaleString("en-IN")],
    ["Total Months",(years*12+months).toLocaleString("en-IN")],
    ["Total Weeks",totalWeeks.toLocaleString("en-IN")],
    ["Extra Days After Weeks",remainingDays],
    ["Total Days",totalDays.toLocaleString("en-IN")]
  ];

  rows.forEach(([label,value])=>{
    const row=document.createElement("div");
    const strong=document.createElement("strong");
    strong.textContent=label+": ";
    row.appendChild(strong);
    row.appendChild(document.createTextNode(value));
    details.appendChild(row);
  });

  result.style.display="block";
  result.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}

function resetCalculator(){
  dobInput.value="";
  asOfInput.value=getLocalDateString(new Date());

  document.getElementById("error").textContent="";
  document.getElementById("result").style.display="none";
}

// Set maximum date of birth and default calculation date.
const today = getLocalDateString(new Date());

dobInput.max=today;
asOfInput.value=today;

// Recalculate only when user clicks Calculate Age.
</script>
