<main class="container">
  <section class="card">
    <h1>🎂 Age Calculator</h1>
    <p class="subtitle">Calculate your exact age in years, months and days.</p>

    <label for="dob">Enter Your Date of Birth:</label>
    <input type="date" id="dob">

    <button onclick="calculateAge()">Calculate Age</button>

    <p id="error"></p>

    <div id="result">
      <h2>Your Age Is</h2>
      <div class="age" id="ageText"></div>
      <div class="details" id="details"></div>
    </div>
  </section>
</main>

<footer>© 2026 ToolSahayak. All Rights Reserved.</footer>

<script>
  const dobInput = document.getElementById("dob");

  function dateString(date) {
    const d = date.getDate().toString().padStart(2, "0");
    const m = (date.getMonth() + 1).toString().padStart(2, "0");
    const y = date.getFullYear();
    return `${d}-${m}-${y}`;
  }

  function daysBetween(start, end) {
    const utcStart = Date.UTC(
      start.getFullYear(), start.getMonth(), start.getDate()
    );
    const utcEnd = Date.UTC(
      end.getFullYear(), end.getMonth(), end.getDate()
    );
    return Math.floor((utcEnd - utcStart) / 86400000);
  }

  function calculateAge() {
    const error = document.getElementById("error");
    const result = document.getElementById("result");
    error.textContent = "";
    result.style.display = "none";

    if (!dobInput.value) {
      error.textContent = "Please enter your date of birth.";
      return;
    }

    const [year, month, day] = dobInput.value.split("-").map(Number);
    const dob = new Date(year, month - 1, day);
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (
      dob.getFullYear() !== year ||
      dob.getMonth() !== month - 1 ||
      dob.getDate() !== day
    ) {
      error.textContent = "Please enter a valid date.";
      return;
    }

    if (dob > today) {
      error.textContent = "Date of birth cannot be in the future.";
      return;
    }

    let years = today.getFullYear() - year;
    let months = today.getMonth() - (month - 1);
    let days = today.getDate() - day;

    if (days < 0) {
      months--;
      const previousMonthDays = new Date(
        today.getFullYear(), today.getMonth(), 0
      ).getDate();
      days += previousMonthDays;
    }

    if (months < 0) {
      years--;
      months += 12;
    }

    const totalDays = daysBetween(dob, today);
    const totalWeeks = Math.floor(totalDays / 7);
    const birthDay = dob.toLocaleDateString("en-IN", {
      weekday: "long"
    });

    // For 29 February birthdays, use 28 February in non-leap years.
    function nextBirthdayDate(targetYear) {
      if (month === 2 && day === 29) {
        const isLeap = new Date(targetYear, 1, 29).getMonth() === 1;
        return new Date(targetYear, 1, isLeap ? 29 : 28);
      }
      return new Date(targetYear, month - 1, day);
    }

    let nextBirthday = nextBirthdayDate(today.getFullYear());
    if (nextBirthday < today) {
      nextBirthday = nextBirthdayDate(today.getFullYear() + 1);
    }

    const daysLeft = daysBetween(today, nextBirthday);

    document.getElementById("ageText").textContent =
      `${years} Years, ${months} Months, ${days} Days`;

    document.getElementById("details").innerHTML = `
      <strong>Date of Birth:</strong> ${dateString(dob)}<br>
      <strong>Birth Day:</strong> ${birthDay}<br>
      <strong>Total Days:</strong> ${totalDays.toLocaleString("en-IN")}<br>
      <strong>Total Weeks:</strong> ${totalWeeks.toLocaleString("en-IN")}<br>
      <strong>Next Birthday:</strong> ${dateString(nextBirthday)}<br>
      <strong>Days Until Birthday:</strong> ${daysLeft}
    `;

    result.style.display = "block";
  }

  dobInput.max = new Date().toISOString().split("T")[0];
</script>
