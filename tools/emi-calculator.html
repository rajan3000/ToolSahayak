<body>

<header><a href="../index.html">🟪 ToolSahayak</a></header>

<main class="container">
<section class="card">
<h1>🏦 EMI Calculator</h1>
<p class="subtitle">Calculate your monthly loan EMI instantly.</p>

<label for="amount">Loan Amount (₹)</label>
<input type="number" id="amount" placeholder="Example: 500000" min="1">

<label for="rate">Annual Interest Rate (%)</label>
<input type="number" id="rate" placeholder="Example: 8.5" min="0" step="0.01">

<label for="tenure">Loan Tenure (Years)</label>
<input type="number" id="tenure" placeholder="Example: 20" min="1" step="0.5">

<button onclick="calculateEMI()">Calculate EMI</button>

<p id="error"></p>

<div id="result">
<div class="result-box">
<p>Your Monthly EMI</p>
<div class="emi" id="emi">₹0</div>
<h2 id="monthlyText"></h2>
</div>

<div class="details">
<strong>Total Loan Amount:</strong> <span id="principal"></span><br>
<strong>Total Interest:</strong> <span id="interest"></span><br>
<strong>Total Payment:</strong> <span id="payment"></span><br>
<strong>Loan Tenure:</strong> <span id="duration"></span>
</div>
</div>
</section>
</main>

<footer>© 2026 ToolSahayak. All Rights Reserved.</footer>

<script>
function formatRupees(value){
 return "₹" + Math.round(value).toLocaleString("en-IN");
}

function calculateEMI(){
 const amount = Number(document.getElementById("amount").value);
 const rate = Number(document.getElementById("rate").value);
 const years = Number(document.getElementById("tenure").value);
 const error = document.getElementById("error");
 const result = document.getElementById("result");

 error.textContent = "";
 result.style.display = "none";

 if(!Number.isFinite(amount) || amount <= 0){
   error.textContent = "Please enter a valid loan amount.";
   return;
 }

 if(!Number.isFinite(rate) || rate < 0){
   error.textContent = "Please enter a valid interest rate.";
   return;
 }

 if(!Number.isFinite(years) || years <= 0){
   error.textContent = "Please enter a valid loan tenure.";
   return;
 }

 const months = Math.round(years * 12);
 const monthlyRate = rate / 12 / 100;

 let emi;

 if(monthlyRate === 0){
   emi = amount / months;
 } else {
   const factor = Math.pow(1 + monthlyRate, months);
   emi = amount * monthlyRate * factor / (factor - 1);
 }

 const totalPayment = emi * months;
 const totalInterest = totalPayment - amount;

 document.getElementById("emi").textContent = formatRupees(emi);
 document.getElementById("monthlyText").textContent = "Per Month";
 document.getElementById("principal").textContent = formatRupees(amount);
 document.getElementById("interest").textContent = formatRupees(totalInterest);
 document.getElementById("payment").textContent = formatRupees(totalPayment);
 document.getElementById("duration").textContent =
   months + " Months (" + years + " Years)";

 result.style.display = "block";
}
</script>
